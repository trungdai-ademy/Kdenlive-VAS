# Build Kdenlive (upstream tag) + VAS patches for Windows with KDE Craft, the same way KDE's CI builds the official installer
# (invent.kde.org/sysadmin/craft-ci gitlab-templates/blocks/windows-base.yml). Result (or the Craft logs on failure) is published as a
# GitHub pre-release so it can be downloaded without credentials and then verified by VAS's safety gate before use.
name: build-windows

on:
  push:
    branches: [main]
    paths: ["patches/**", "craft/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      PYTHONUTF8: "1"
      KDENLIVE_TAG: v26.08.2
      # the exact MLT commit KDE Craft builds for Kdenlive (craft-blueprints-kde libs/mlt/mlt.py defaultTarget 7a3319f): ours differs only by patches/mlt
      MLT_COMMIT: 7a3319fc6dbfa2fbf8fe90b5b94344a210ce4f8c
      CRAFT_TARGET: windows-msvc2022_64-cl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upstream source + VAS patches
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:KDENLIVE_TAG https://invent.kde.org/multimedia/kdenlive.git C:/kdenlive-src
          if ($LASTEXITCODE) { exit 1 }
          Push-Location C:/kdenlive-src
          foreach ($p in Get-ChildItem "$env:GITHUB_WORKSPACE/patches/*.patch" | Sort-Object Name) {
            git apply --check $p.FullName; if ($LASTEXITCODE) { Write-Error "patch does not apply: $($p.Name)"; exit 1 }
            git apply $p.FullName
            Write-Host "applied $($p.Name)"
          }
          Pop-Location

      - name: MLT source (pinned) + VAS patches
        shell: pwsh
        run: |
          git init -q C:/mlt-src
          Push-Location C:/mlt-src
          git remote add origin https://github.com/mltframework/mlt.git
          git fetch -q --depth 1 origin $env:MLT_COMMIT; if ($LASTEXITCODE) { exit 1 }
          git checkout -q FETCH_HEAD
          foreach ($p in Get-ChildItem "$env:GITHUB_WORKSPACE/patches/mlt/*.patch" | Sort-Object Name) {
            git apply --check $p.FullName; if ($LASTEXITCODE) { Write-Error "MLT patch does not apply: $($p.Name)"; exit 1 }
            git apply $p.FullName
            Write-Host "applied MLT $($p.Name)"
          }
          Pop-Location

      - name: Craft tooling
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:/Craft | Out-Null
          git clone --depth 1 https://invent.kde.org/packaging/craftmaster.git C:/Craft/craftmaster
          $py = (Split-Path (Get-Command python).Source).Replace('\', '/')
          (Get-Content "$env:GITHUB_WORKSPACE/craft/CraftConfig.ini" -Raw).Replace('@PYTHON_DIR@', $py) | Set-Content C:/Craft/CraftConfig.ini -Encoding utf8

      - name: Build and package
        shell: pwsh
        run: |
          Set-Location C:/Craft
          $jobStart = Get-Date
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/logs" | Out-Null
          $log = "$env:GITHUB_WORKSPACE/logs/build.log"
          # full output kept in logs/build.log (published on failure); the console shows each step's tail
          function CM {
            "===== CraftMaster $args" | Add-Content $log
            python -u craftmaster/CraftMaster.py --config C:/Craft/CraftConfig.ini --target $env:CRAFT_TARGET @args *>> $log
            $code = $LASTEXITCODE
            Get-Content $log -Tail 25
            if ($code -ne 0) { exit $code }
          }
          CM --setup
          CM -c -i --options virtual.ignored=True --update craft
          # downloads (MSYS2 mirrors, KDE cache) sometimes stall (run 2: "Operation too slow" on an MSYS2 mirror) -> retry the network-heavy steps
          function CMRetry {
            for ($i = 1; $i -le 3; $i++) {
              "===== CraftMaster (attempt $i) $args" | Add-Content $log
              python -u craftmaster/CraftMaster.py --config C:/Craft/CraftConfig.ini --target $env:CRAFT_TARGET @args *>> $log
              $code = $LASTEXITCODE
              Get-Content $log -Tail 15
              if ($code -eq 0) { return }
              Start-Sleep -Seconds 60
            }
            exit $code
          }
          CMRetry -c --install-deps --options "[CodeSigning]Enabled=False" kdenlive
          # MLT and Kdenlive from the patched sources (srcDir set in craft/CraftConfig.ini, so every later step sees the same versions)
          CM -c --no-cache libs/mlt
          CM -c --no-cache kdenlive
          CMRetry -c -i --update nsis
          CM -c --package kdenlive
          $pkg = (python -u craftmaster/CraftMaster.py --config C:/Craft/CraftConfig.ini --target $env:CRAFT_TARGET -c -q --get "packageDestinationDir()" virtual/base | Select-Object -Last 1).Trim()
          Write-Host "package dir: $pkg"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/out" | Out-Null
          Get-ChildItem -Path $pkg -Recurse -Include *.exe, *.7z | Copy-Item -Destination "$env:GITHUB_WORKSPACE/out"
          # repack the .7z without the files listed in craft/exclude-from-package.txt (antivirus false positives, documented there)
          $excl = @(Get-Content "$env:GITHUB_WORKSPACE/craft/exclude-from-package.txt" | Where-Object { $_.Trim() -and -not $_.StartsWith('#') } | ForEach-Object { $_.Trim().Replace('/', [IO.Path]::DirectorySeparatorChar) })
          $orig = Get-ChildItem "$env:GITHUB_WORKSPACE/out/*.7z" | Select-Object -First 1
          $tmp = "C:/repack"
          & 7z x $orig.FullName "-o$tmp" -y | Out-Null; if ($LASTEXITCODE) { exit 1 }
          # an entry that is not in the package is an ERROR (run 4: a broken path silently excluded nothing)
          foreach ($e in $excl) { $f = Join-Path $tmp $e; if (Test-Path -LiteralPath $f) { Remove-Item -LiteralPath $f -Force; Write-Host "excluded $e" } else { Write-Error "exclude entry not found in package: $e"; exit 1 } }
          foreach ($e in $excl) { if (Test-Path -LiteralPath (Join-Path $tmp $e)) { Write-Error "still present after exclusion: $e"; exit 1 } }
          # the patched binaries must be the ones built in THIS job, not KDE's cached ones (run 7 shipped the cached, unpatched melt.exe)
          foreach ($b in "bin/melt.exe", "bin/mlt-7.dll", "bin/kdenlive.exe") {
            $f = Get-Item -LiteralPath (Join-Path $tmp $b) -ErrorAction SilentlyContinue
            if (-not $f) { Write-Error "missing from package: $b"; exit 1 }
            if ($f.LastWriteTime -lt $jobStart) { Write-Error "$b in the package is not from this build ($($f.LastWriteTime) < $jobStart): cached binary"; exit 1 }
            Write-Host "built in this job: $b $($f.LastWriteTime)"
          }
          Remove-Item $orig.FullName
          Push-Location $tmp
          & 7z a -t7z -mx=7 "$env:GITHUB_WORKSPACE/out/kdenlive-vas-$env:GITHUB_RUN_NUMBER-windows-x86_64.7z" * | Out-Null; if ($LASTEXITCODE) { exit 1 }
          Pop-Location
          Get-ChildItem "$env:GITHUB_WORKSPACE/out" | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content "$env:GITHUB_WORKSPACE/out/SHA256SUMS.txt" -Encoding ascii
          Get-ChildItem "$env:GITHUB_WORKSPACE/out"

      - name: Publish build
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Kdenlive $env:KDENLIVE_TAG + VAS patches ($env:GITHUB_SHA). Unsigned test build - verify SHA256SUMS.txt. The .7z omits the files listed in craft/exclude-from-package.txt (antivirus false positives); the .exe installer is Craft's original output. Source: upstream tag + patches/ in this repository (GPL-3.0)."
          # build log attached too (run 7: the package silently used cached MLT and there was no log to see why)
          Compress-Archive -Path "$env:GITHUB_WORKSPACE/logs/build.log" -DestinationPath "$env:GITHUB_WORKSPACE/build-log.zip" -Force
          $extra = @("$env:GITHUB_WORKSPACE/build-log.zip")
          # debug symbols of kdenlive.exe (best effort): turn a crash offset from the Windows event log into a function name
          $pdb = Get-ChildItem "C:/Craft/$env:CRAFT_TARGET/build" -Recurse -Filter kdenlive.pdb -ErrorAction SilentlyContinue | Sort-Object Length -Descending | Select-Object -First 1
          if ($pdb) { Compress-Archive -Path $pdb.FullName -DestinationPath "$env:GITHUB_WORKSPACE/kdenlive-pdb.zip" -Force; $extra += "$env:GITHUB_WORKSPACE/kdenlive-pdb.zip"; Write-Host "pdb: $($pdb.FullName)" } else { Write-Host "no kdenlive.pdb found" }
          gh release create "build-$env:GITHUB_RUN_NUMBER" @((Get-ChildItem "$env:GITHUB_WORKSPACE/out").FullName) @extra --prerelease --title "Kdenlive VAS build $env:GITHUB_RUN_NUMBER" --notes $notes --target $env:GITHUB_SHA

      - name: Publish logs on failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $logs = "C:/Craft/$env:CRAFT_TARGET/logs"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/logs" | Out-Null
          if (Test-Path $logs) { Compress-Archive -Path "$logs/*" -DestinationPath "$env:GITHUB_WORKSPACE/logs/craft-logs.zip" -Force }
          "run $env:GITHUB_RUN_NUMBER failed at $(Get-Date -Format o)" | Set-Content "$env:GITHUB_WORKSPACE/logs/README.txt"
          gh release create "logs-$env:GITHUB_RUN_NUMBER" (Get-ChildItem "$env:GITHUB_WORKSPACE/logs").FullName --prerelease --title "Build logs $env:GITHUB_RUN_NUMBER (failed)" --notes "Craft logs of a failed build." --target $env:GITHUB_SHA
